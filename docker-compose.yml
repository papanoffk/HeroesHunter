x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:-admin}
  DB_PASSWORD: ${DB_PASSWORD:-password}
  DB_NAME: ${DB_NAME:-hh-db}

x-rabbit-env: &rabbit-env
  RABBITMQ_URL: amqp://${RABBIT_USER:-admin}:${RABBIT_PASSWORD:-password}@rabbitmq:5672/

x-auth-common: &auth-common
  build:
    context: .
    dockerfile: services/auth/Dockerfile
  env_file:
    - path: ./services/auth/.env
      required: false
  environment: *db-env
  networks:
    - hh-network

x-heroes-common: &heroes-common
  build:
    context: .
    dockerfile: services/heroes/Dockerfile
  env_file:
    - path: ./services/heroes/.env
      required: false
  environment: *db-env
  networks:
    - hh-network

x-corporations-common: &corporations-common
  build:
    context: .
    dockerfile: services/corporations/Dockerfile
  env_file:
    - path: ./services/corporations/.env
      required: false
  environment: *db-env
  networks:
    - hh-network

x-missions-common: &missions-common
  build:
    context: .
    dockerfile: services/missions/Dockerfile
  env_file:
    - path: ./services/missions/.env
      required: false
  environment:
    <<: [*db-env, *rabbit-env]
  networks:
    - hh-network

x-resumes-common: &resumes-common
  build:
    context: .
    dockerfile: services/resumes/Dockerfile
  env_file:
    - path: ./services/resumes/.env
      required: false
  environment:
    <<: [*db-env, *rabbit-env]
  networks:
    - hh-network

services:
  postgres:
    image: postgres:17
    container_name: hh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-hh-db}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - hh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-hh-db}"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  rabbitmq:
    image: rabbitmq:4-management
    container_name: hh-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    networks:
      - hh-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-migrate:
    <<: *auth-common
    container_name: hh-auth-migrate
    command: ["auth-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    <<: *auth-common
    container_name: hh-auth
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  heroes-migrate:
    <<: *heroes-common
    container_name: hh-heroes-migrate
    command: ["heroes-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  heroes:
    <<: *heroes-common
    container_name: hh-heroes
    restart: unless-stopped
    ports:
      - "8001:8000"
    depends_on:
      heroes-migrate:
        condition: service_completed_successfully

  corporations-migrate:
    <<: *corporations-common
    container_name: hh-corporations-migrate
    command: ["corporations-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  corporations:
    <<: *corporations-common
    container_name: hh-corporations
    restart: unless-stopped
    ports:
      - "8002:8000"
    depends_on:
      corporations-migrate:
        condition: service_completed_successfully

  missions-migrate:
    <<: *missions-common
    container_name: hh-missions-migrate
    command: ["missions-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  missions:
    <<: *missions-common
    container_name: hh-missions
    restart: unless-stopped
    ports:
      - "8003:8000"
    depends_on:
      missions-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  resumes-migrate:
    <<: *resumes-common
    container_name: hh-resumes-migrate
    command: ["resumes-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  resumes:
    <<: *resumes-common
    container_name: hh-resumes
    restart: unless-stopped
    ports:
      - "8004:8000"
    depends_on:
      resumes-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    container_name: hh-notifications
    restart: unless-stopped
    env_file:
      - path: ./services/notifications/.env
        required: false
    environment: *rabbit-env
    ports:
      - "8005:8000"
    networks:
      - hh-network
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: hh-gateway
    restart: unless-stopped
    env_file:
      - path: ./services/gateway/.env
        required: false
    environment:
      AUTH_URL: http://auth:8000
      HEROES_URL: http://heroes:8000
      CORPORATIONS_URL: http://corporations:8000
      MISSIONS_URL: http://missions:8000
      RESUMES_URL: http://resumes:8000
      NOTIFICATIONS_URL: http://notifications:8000
    ports:
      - "8080:8000"
    networks:
      - hh-network
    depends_on:
      auth:
        condition: service_healthy
      heroes:
        condition: service_healthy
      corporations:
        condition: service_healthy
      missions:
        condition: service_healthy
      resumes:
        condition: service_healthy
      notifications:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    container_name: hh-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/public:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    networks:
      - hh-network
    depends_on:
      gateway:
        condition: service_healthy

networks:
  hh-network: 
