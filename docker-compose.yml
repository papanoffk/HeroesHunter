x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:-admin}
  DB_PASSWORD: ${DB_PASSWORD:-password}
  DB_NAME: ${DB_NAME:-hh-db}

x-auth-common: &auth-common
  build:
    context: .
    dockerfile: services/auth/Dockerfile
  env_file:
    - path: ./services/auth/.env
      required: false
  environment: *db-env
  networks:
    - hh-network

x-heroes-common: &heroes-common
  build:
    context: .
    dockerfile: services/heroes/Dockerfile
  env_file:
    - path: ./services/heroes/.env
      required: false
  environment: *db-env
  networks:
    - hh-network

x-corporations-common: &corporations-common
  build:
    context: .
    dockerfile: services/corporations/Dockerfile
  env_file:
    - path: ./services/corporations/.env
      required: false
  environment: *db-env
  networks:
    - hh-network

x-missions-common: &missions-common
  build:
    context: .
    dockerfile: services/missions/Dockerfile
  env_file:
    - path: ./services/missions/.env
      required: false
  environment: *db-env
  networks:
    - hh-network

services:
  postgres:
    image: postgres:17
    container_name: hh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-hh-db}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - hh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-hh-db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-migrate:
    <<: *auth-common
    container_name: hh-auth-migrate
    command: ["auth-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    <<: *auth-common
    container_name: hh-auth
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  heroes-migrate:
    <<: *heroes-common
    container_name: hh-heroes-migrate
    command: ["heroes-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  heroes:
    <<: *heroes-common
    container_name: hh-heroes
    restart: unless-stopped
    ports:
      - "8001:8000"
    depends_on:
      heroes-migrate:
        condition: service_completed_successfully

  corporations-migrate:
    <<: *corporations-common
    container_name: hh-corporations-migrate
    command: ["corporations-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  corporations:
    <<: *corporations-common
    container_name: hh-corporations
    restart: unless-stopped
    ports:
      - "8002:8000"
    depends_on:
      corporations-migrate:
        condition: service_completed_successfully

  missions-migrate:
    <<: *missions-common
    container_name: hh-missions-migrate
    command: ["missions-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  missions:
    <<: *missions-common
    container_name: hh-missions
    restart: unless-stopped
    ports:
      - "8003:8000"
    depends_on:
      missions-migrate:
        condition: service_completed_successfully

networks:
  hh-network: 
