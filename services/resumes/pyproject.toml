[project]
name = "resumes"
version = "0.1.0"
description = "Resumes service: hero resumes and corporation invitations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.0.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
    "yoyo-migrations>=9.0.0",
]

[project.scripts]
resumes-migrate = "resumes.migrate:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]



