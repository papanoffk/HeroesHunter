[project]
name = "gateway"
version = "0.1.0"
description = "API gateway: routing to services and token verification via auth"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

